[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardiansim"
version = "0.1.0"
description = "Counterfactual planning, risk scoring, and failure recovery for robot manipulation on AMD Radeon GPUs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Physics engine + renderer this demo is built on.
    "genesis-world>=1.1.2",
    # Numba (used by Genesis) currently rejects NumPy >=2.3.  Keeping this
    # explicit also prevents uv from silently upgrading a working ROCm image.
    "numpy>=1.26.4,<2.3",
    # Genesis' older transitive pin is not NumPy-2 ABI compatible.
    "scikit-image>=0.25.2",
    "trimesh>=4.8.2",
    # Camera-image handling and video export.
    "opencv-python",
    "imageio",
    "imageio-ffmpeg",
    # Plotting for the diagnostic / eval-sweep tools.
    "matplotlib",
]

[project.optional-dependencies]
# Policy training + closed-loop evaluation (M5). Install torch from the official index for
# your CUDA / ROCm / CPU build (see README) -- do not rely on the default wheel here.
# NOTE: lerobot 0.6.0 split its install into feature-scoped extras; this demo needs
# `lerobot[training,smolvla]` ([training] -> [dataset] = datasets/av/pyarrow/torchcodec +
# wandb + accelerate; [smolvla] -> transformers/num2words; ACT needs no extra). The actual
# optional install is documented in the upstream M5 section
# (`uv pip install "lerobot[training,smolvla]==0.6.0"`), not included in the
# GuardianSim evaluator environment, so this marker stays out of the core lock.
learn = [
    "torch",
    "lerobot",
]

[project.scripts]
guardiansim-demo = "guardian_sim.cli:main"
guardiansim-benchmark = "guardian_sim.benchmark_cli:main"

[tool.uv]
# genesis-world pulls an unpinned numba; on Python 3.12 the resolver can pick 0.53.x
# (llvmlite 0.36) which only supports Python <3.10. Force a 3.12-compatible stack.
override-dependencies = [
    "numba>=0.59",
    "llvmlite>=0.42",
]

[tool.setuptools.packages.find]
include = ["franka_fruit_pick*", "guardian_sim*"]

[tool.ruff]
line-length = 120
